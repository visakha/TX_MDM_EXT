# Built-in safe defaults only. Real values come from the EXTERNAL application.properties
# (see application.properties.example), passed with --spring.config.location or
# --spring.config.additional-location.
spring.application.name=tx-mdm-ext
spring.main.web-application-type=none
# HARD RULE: the app never runs DDL.
spring.sql.init.mode=never
txmdmext.schedule.cron=0 5 * * * *
txmdmext.batch-size=1000
txmdmext.zone=UTC
txmdmext.run-once=false
txmdmext.idmc.enabled=false
