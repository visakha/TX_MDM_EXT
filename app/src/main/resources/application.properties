# Built-in safe settings only. Everything else (database, txmdmext.scan.interval,
# txmdmext.md5.*, IDMC) comes from the EXTERNAL application.properties passed with
# --spring.config.location. See application.properties.example.
spring.application.name=tx-mdm-ext
spring.main.web-application-type=none
# HARD RULE: the app never runs DDL.
spring.sql.init.mode=never
